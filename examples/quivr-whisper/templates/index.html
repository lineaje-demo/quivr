<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio Interaction WebApp</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles.css') }}"
    />
  </head>

  <body>
    <button
      type="button"
      id="record-btn"
      class="record-btn hidden"
      data-recording="false"
      data-pending="false"
    ></button>
    <div class="custom-file-input">
      <label for="fileInput">Choose a file</label>
      <input
        type="file"
        accept="text/plain"
        name="fileInput"
        required
        id="fileInput"
      />
      <span id="fileName">No file chosen</span>
      <button id="upload-btn" class="upload-btn">Upload</button>
    </div>
    <canvas id="audio-visualizer" class=""></canvas>
    <audio id="audio-playback" controls class="hidden"></audio>
    <script>
      // PII redaction for uploaded files (_ai_dat_sec_023_)
      const _ai_dat_sec_023_patterns = [
        { name: 'SSN',                  re: /\b\d{3}-\d{2}-\d{4}\b/g },
        { name: 'YearOfBirth',          re: /\b(19|20)\d{2}\b/g },
        { name: 'Email',                re: /\b[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}\b/g },
        { name: 'PhoneNumber',          re: /\b(\+?1[\s.-]?)?\(?\d{3}\)?[\s.-]?\d{3}[\s.-]?\d{4}\b/g },
        { name: 'PassportNumber',       re: /\b[A-Z]{1,2}\d{6,9}\b/g },
        { name: 'DriversLicense',       re: /\b[A-Z]{1,2}\d{5,8}\b/g },
        { name: 'TaxpayerID',           re: /\b\d{2}-\d{7}\b/g },
        { name: 'CreditCard',           re: /\b(?:\d[ -]?){13,16}\b/g },
        { name: 'FinancialAccount',     re: /\b\d{8,17}\b/g },
        { name: 'IPAddress',            re: /\b(?:\d{1,3}\.){3}\d{1,3}\b/g },
        { name: 'MACAddress',           re: /\b([0-9A-Fa-f]{2}[:\-]){5}[0-9A-Fa-f]{2}\b/g },
        { name: 'VIN',                  re: /\b[A-HJ-NPR-Z0-9]{17}\b/g },
        { name: 'HomeAddress',          re: /\b\d{1,5}\s+([A-Za-z]+\s){1,4}(St|Ave|Blvd|Rd|Dr|Ln|Way|Ct|Pl)\.?\b/gi },
        { name: 'EmployeeId',           re: /\bEMP[-]?\d{4,10}\b/gi },
        { name: 'SchoolId',             re: /\bSTU[-]?\d{4,10}\b/gi },
        { name: 'Birthplace',           re: /\bborn\s+in\s+[A-Za-z ,]+/gi },
        { name: 'MothersMaidenName',    re: /\bmaiden\s+name[:\s]+[A-Za-z]+/gi },
        { name: 'Ethnicity',            re: /\b(African American|Asian|Caucasian|Hispanic|Latino|Native American|Pacific Islander|Middle Eastern)\b/gi },
        { name: 'SexualOrientation',    re: /\b(heterosexual|homosexual|bisexual|lesbian|gay|queer|asexual)\b/gi },
        { name: 'MedicalRecord',        re: /\bMRN[-]?\d{4,12}\b/gi },
        { name: 'FineLocation',         re: /\b-?\d{1,3}\.\d{5,}\s*,\s*-?\d{1,3}\.\d{5,}\b/g }
      ];

      function _ai_dat_sec_023_redact(text) {
        let redacted = text;
        _ai_dat_sec_023_patterns.forEach(function(p) {
          redacted = redacted.replace(p.re, '[REDACTED-' + p.name + ']');
        });
        return redacted;
      }

      document.getElementById('upload-btn').addEventListener('click', function(e) {
        const fileInput = document.getElementById('fileInput');
        if (!fileInput.files || fileInput.files.length === 0) return;
        const file = fileInput.files[0];
        const reader = new FileReader();
        reader.onload = function(evt) {
          const original = evt.target.result;
          const sanitized = _ai_dat_sec_023_redact(original);
          const blob = new Blob([sanitized], { type: file.type });
          const sanitizedFile = new File([blob], file.name, { type: file.type });
          const dt = new DataTransfer();
          dt.items.add(sanitizedFile);
          fileInput.files = dt.files;
          fileInput.dispatchEvent(new Event('_ai_dat_sec_023_ready'));
        };
        reader.readAsText(file);
        e.stopImmediatePropagation();
      }, true);
    </script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
